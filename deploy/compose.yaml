services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data

  scraper:
    build: ..
    environment:
      REDIS_URL: redis://redis:6379
      RESULTS_DIR: /srv/quotes-scraper/results
    volumes:
      - results:/srv/quotes-scraper/results
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80" # Публикуем только HTTP
    volumes:
      - results:/srv/quotes-scraper/results:ro # Read-only!
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - scraper

volumes:
  redis_data:
  results:
