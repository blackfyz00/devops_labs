server {
    listen 80;
    server_name _;

    location /results/ {
        alias /srv/quotes-scraper/results/;
        autoindex off;

        # Разрешаем только GET запросы к JSON
        types {
            application/json json;
        }

        # Безопасность: запрет доступа к временным файлам (.tmp-)
        location ~ /\.tmp-.*\.json$ {
            deny all;
        }
    }

    # Корень сайта - редирект или заглушка
    location / {
        return 404;
    }
}
