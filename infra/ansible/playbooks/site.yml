# infra/ansible/playbooks/site.yml
- name: Setup VM
  hosts: lab
  become: true
  gather_facts: false 

  tasks:
    - name: Ensure Python3 and dependencies are installed
      ansible.builtin.apt:
        name:
          - python3
          - python3-simplejson
          - python3-debian
        state: present
        update_cache: yes

    - name: Gather facts now that Python is available
      setup:

    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - rsync
          - lsb-release
        state: present
        update_cache: yes

    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG Key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker Repository
      deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: "{{ ansible_architecture }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker Engine and Plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes 

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes