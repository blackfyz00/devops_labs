[project]
name = "devops"
version = "0.1.0"
description = "devops"
readme = "README.md"
authors = [
    { name = "Заславский Ярослав", email = "blackfyz@yandex.ru" }
]

requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
